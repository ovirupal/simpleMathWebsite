<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Math — Grade 2</title>
<style>
:root{--ink:#24324a;--purple:#6658d3;--mint:#dff8ea;--yellow:#fff1bd;--pink:#ffe3e8}*{box-sizing:border-box}body{margin:0;background:#f7f8ff;color:var(--ink);font-family:system-ui,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:24px 18px 50px}.hero{text-align:center;padding:25px 12px 18px}.hero .emoji{font-size:48px}.hero h1{font-size:clamp(28px,6vw,44px);margin:6px 0;color:#4c43ae}.hero p{font-size:18px;margin:8px 0}.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.tabs button,.check,.next{border:0;border-radius:14px;padding:12px 20px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;transition:.15s}.tabs button{background:white;color:var(--ink);box-shadow:0 3px 12px #28345914}.tabs button.active{background:var(--purple);color:#fff}.tabs button:hover,.check:hover,.next:hover{transform:translateY(-2px)}.card{background:white;border-radius:24px;padding:24px;box-shadow:0 12px 35px #28345912;max-width:680px;margin:0 auto}.score{text-align:right;font-weight:700;color:#6d668f}.question{text-align:center;padding:10px 0}.question .label{font-size:18px;color:#747b91}.sum{font-size:clamp(42px,10vw,68px);font-weight:800;letter-spacing:3px;margin:10px 0 18px;color:#353d68}.answer{width:150px;text-align:center;border:3px solid #d9dcf0;border-radius:16px;padding:10px;font:700 30px system-ui,sans-serif;color:var(--ink);outline:none}.answer:focus{border-color:var(--purple)}.check{display:block;margin:16px auto 8px;background:#ffca4b;color:#49390f}.feedback{text-align:center;min-height:30px;font-size:19px;font-weight:700}.feedback.good{color:#16804b}.feedback.bad{color:#d04b54}.next{display:none;margin:12px auto 0;background:#e8e6ff;color:#4c43ae}.next.show{display:block}.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:800px;margin:22px auto 0}.tip{padding:15px;border-radius:18px;text-align:center}.tip:nth-child(1){background:var(--mint)}.tip:nth-child(2){background:var(--yellow)}.tip:nth-child(3){background:var(--pink)}.tip b{display:block;font-size:18px;margin-bottom:4px}.tip span{font-size:15px}.footer{text-align:center;color:#7a8091;margin-top:22px;font-size:14px}@media(max-width:600px){.tips{grid-template-columns:1fr}.card{padding:20px 14px}.tabs button{padding:10px 14px;font-size:15px}}
</style>
<script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/10/26/12/20261026121042-GKDOHH9C.js" defer></script>
  
</head>
<body><main class="wrap">
<header class="hero"><div class="emoji">🧮 🌈</div><h1>Fun Math</h1><p>A little math practice for Grade 2!</p></header>
<nav class="tabs" aria-label="Choose a math activity"><button class="active" data-mode="add">➕ Addition</button><button data-mode="sub">➖ Subtraction</button><button data-mode="mix">🎲 Mix It Up</button></nav>
<section class="card"><div class="score">⭐ Correct answers: <span id="score">0</span></div><div class="question"><div class="label">What is the answer?</div><div class="sum" id="sum">5 + 3 = ?</div><input class="answer" id="answer" type="number" inputmode="numeric" min="0" max="100" aria-label="Your answer"></div><button class="check" id="check">Check Answer ✅</button><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next">Next Question ➜</button></section>
<section class="tips"><div class="tip"><b>➕ Addition</b><span>Put two numbers together</span></div><div class="tip"><b>➖ Subtraction</b><span>Take a smaller number away</span></div><div class="tip"><b>🌟 Keep trying!</b><span>Mistakes help us learn</span></div></section>
<p class="footer">Take your time and have fun learning! 😊</p></main>
<script>
let mode='add',a=5,b=3,answer=8,score=0,done=false;
const sumEl=document.getElementById('sum'),input=document.getElementById('answer'),feedback=document.getElementById('feedback'),next=document.getElementById('next');
function question(){done=false;feedback.textContent='';feedback.className='feedback';next.classList.remove('show');input.value='';let op=mode==='mix'?(Math.random()<.5?'add':'sub'):mode;if(op==='add'){a=1+Math.floor(Math.random()*49);b=1+Math.floor(Math.random()*(50-a));answer=a+b;sumEl.textContent=`${a} + ${b} = ?`}else{a=2+Math.floor(Math.random()*49);b=1+Math.floor(Math.random()*(a-1));answer=a-b;sumEl.textContent=`${a} − ${b} = ?`}input.focus()}
document.querySelectorAll('.tabs button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelector('.tabs .active').classList.remove('active');btn.classList.add('active');mode=btn.dataset.mode;question()}));
document.getElementById('check').addEventListener('click',()=>{if(done)return;if(input.value===''){feedback.textContent='Type your answer first 🙂';feedback.className='feedback bad';return}if(Number(input.value)===answer){feedback.textContent='🎉 Correct! Great job!';feedback.className='feedback good';score++;document.getElementById('score').textContent=score;done=true;next.classList.add('show')}else{feedback.textContent='Almost! Try again 💪';feedback.className='feedback bad';input.select()}});
next.addEventListener('click',question);input.addEventListener('keydown',e=>{if(e.key==='Enter'){if(done)question();else document.getElementById('check').click()}});question();
</script></body></html>
